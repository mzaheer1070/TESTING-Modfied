<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mz-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="mz-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="16" fill="url(#mz-bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#mz-grad)" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Stylized Geometric "MZ" Monogram -->
  <!-- M Shape -->
  <path d="M14 44 V20 L24 33 L32 23 L32 44" 
        fill="none" 
        stroke="url(#mz-grad)" 

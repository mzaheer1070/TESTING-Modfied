  <!-- Z Shape connected modernly -->
  <path d="M36 22 H50 L38 42 H52" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

<body>
<header class="portfolio-bridge">
    <div class="portfolio-bridge-inner">
        <a class="bridge-brand" href="../../index.html" data-root-href="index.html">Muhammad Zaheer</a>
        <nav class="bridge-nav" aria-label="Portfolio navigation">
            <a href="../../index.html" data-root-href="index.html">Home</a>
            <a href="../../projects.html" data-root-href="projects.html">Projects</a>
            <a href="../../about.html" data-root-href="about.html">About</a>
            <a href="../../contact.html" data-root-href="contact.html">Contact</a>
        </nav>
        <p class="bridge-badge">Live project · Todo App</p>
    </div>
</header>

<header class="site-bar">
    <a class="back-link" href="../../projects.html" data-root-href="projects.html">
        <svg class="nav-chevron nav-chevron--left" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>

    </a>
</header>

<main class="app-wrap">
    <h1>Todo App</h1>
    <p>Add tasks, mark them done, and filter your list. Saved in your browser.</p>

    <section class="card todo-card">
        <form class="todo-form" id="todo-form">
            <label class="sr-only" for="todo-input">New task</label>
            <input id="todo-input" type="text" placeholder="What do you need to do?" maxlength="120" required>
            <select id="todo-priority" class="todo-priority-select" aria-label="Task priority">
                <option value="normal">Normal</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
            </select>
            <button type="submit">Add Task</button>
        </form>

        <div class="filter-row" role="group" aria-label="Filter tasks">
            <div class="filter-group">
                <button type="button" class="filter-btn is-active" data-filter="all">All <span class="count-badge" id="count-all">0</span></button>
                <button type="button" class="filter-btn" data-filter="active">Active <span class="count-badge" id="count-active">0</span></button>
                <button type="button" class="filter-btn" data-filter="done">Done <span class="count-badge" id="count-done">0</span></button>
            </div>
            <button type="button" class="clear-done-btn" id="clear-done-btn">Clear Completed</button>
        </div>

        <ul class="todo-list" id="todo-list"></ul>
        <p class="empty-msg" id="empty-msg" hidden>No tasks yet — add one above.</p>
    </section>
</main>

<script src="../../js/portfolio-links.js"></script>
<script src="js/app.js"></script>
</body>
</html>
